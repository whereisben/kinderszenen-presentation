<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schumann – Kinderszenen, Op. 15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,500&family=Host+Grotesk:wght@400;500&display=swap">
<style>
:root{--bg:#09090b;--surface:#121215;--line:#222225;--text:#faf8f9;--text2:#e5e5e4;--muted:#d6d6d5;--ink:#040404;
--serif:'EB Garamond',Georgia,serif;--sans:'Host Grotesk',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{width:1280px;height:720px;position:relative;flex:none;transform-origin:center center}
.slide{position:absolute;inset:0;padding:64px;display:none}
.slide.on{display:flex}
h1,h2,p{margin:0}
.d{font-family:var(--serif);font-weight:500}
/* opening */
.open{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px}
.open h1{font-size:168px;line-height:1;letter-spacing:-.02em}
.open .sub{font-size:36px;line-height:1.2;color:var(--text2)}
.small{font-size:14px;color:var(--muted)}
/* piece */
.piece{gap:56px;align-items:stretch}
.left{width:440px;display:flex;flex-direction:column;gap:32px}
.left h2{font-size:56px;line-height:1.08;letter-spacing:-.01em}
.left .en{font-size:30px;line-height:1.2;margin-top:12px;font-style:italic;color:var(--text2)}
.left .no{margin-bottom:16px}
.info{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.info[contenteditable]{outline:none;font-size:17px;line-height:1.55;color:var(--text2)}
.info .lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
.info:focus-within{border-color:var(--muted)}

/* persistent single-player panel on right side of deck */
#video-panel{position:absolute;left:560px;top:64px;width:656px;height:592px;display:flex;flex-direction:column;justify-content:center;gap:20px;z-index:2;transition:opacity .25s ease,transform .25s ease}
#video-panel.hidden{opacity:0;pointer-events:none;visibility:hidden;transform:translateY(8px)}
.video{aspect-ratio:16/9;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.5);overflow:hidden;position:relative}
.video iframe,.video #yt-player{width:100%;height:100%;border:0;display:block}
.video-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.small-dot{color:var(--muted);font-size:13px}
.ts{color:var(--text);text-decoration:underline;text-underline-offset:3px}.ts:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.btn-replay{background:none;border:none;padding:0;color:var(--text);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn-replay:hover{color:#fff}
.btn-replay:focus-visible{outline:2px solid var(--text);outline-offset:3px}

/* overview */
.over{gap:56px;align-items:stretch}
.over .l{width:520px;display:flex;flex-direction:column;justify-content:center;gap:24px}
.over h2{font-size:64px;line-height:1.05;letter-spacing:-.01em}
.over ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:1.5;color:var(--text2)}
.over li{padding-left:18px;position:relative}
.over li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:9999px;background:var(--muted)}
.over .r{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;min-width:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.q blockquote{margin:0;font-family:var(--serif);font-weight:500;font-style:italic;font-size:22px;line-height:1.3}
.q cite{display:block;margin-top:14px;font-style:normal;font-size:14px;line-height:1.5;color:var(--muted)}
.notes{font-size:17px;line-height:1.55;color:var(--text2)}

/* controls */
#bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:5}
#bar button{font:500 14px var(--sans);height:40px;min-width:40px;padding:0 18px;border-radius:9999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
#bar button#next{background:#fff;color:var(--ink);border-color:#fff}
#bar button:hover{border-color:var(--muted)}
#bar button:focus-visible,.info:focus-visible{outline:2px solid var(--text);outline-offset:3px}
#count{font-size:14px;color:var(--muted);min-width:56px;text-align:center}
::selection{background:#faf8f9;color:#040404}
@media (prefers-reduced-motion:no-preference){.slide.on{animation:in .35s ease}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div id="stage"><div id="deck"></div></div>
<nav id="bar" aria-label="Slide navigation">
<button id="prev" aria-label="Previous slide">Back</button>
<span id="count" aria-live="polite"></span>
<button id="next" aria-label="Next slide">Next</button>
</nav>
<script>
/* Single persistent video instance for the whole collection (Ivan Moravec, 1976);
   Instant seeking between piece timestamps with zero reload delay. */
const VIDEO_ID = "pzEUgvo7OpI";
const STARTS = [0,98,174,208,281,375,430,616,680,732,849,962,1115,1251];
const NOTES = [
 "A gentle, narrative opening; the melody floats over a steady, triplet accompaniment.",
 "A playful piece with short, lilting phrases. Crisp accents and grace notes give way to a softer, more delicate middle passage.",
 "Staccato and sudden accents imitate the chase of a game of tag.",
 "A winding melody that continuously ritards before ending in the middle of a phrase. The critic Rellstab mocked its title in 1839, so Schumann wrote to Heinrich Dorn, a composer and conductor who had briefly taught him. His point: the titles came after the music and are only hints for the player, not attempts to imitate a crying child.",
 "Sounding as if it begins in the middle of a phrase; often heard as the answer to the question left open in No. 4. Marked espressivo and legato, with the voices trading phrases.",
 "March-like and proud; resembling a child’s sense of pride in something significant. It is the only piece in the set with a sustained fortissimo, in its middle section.",
 "The best known of the set: one long, singing melody in F major, tender and still. Schumann’s diary for 24 February 1838 calls it “the little thing ‘Träumerei’”.",
 "A catchy melodic line with soft dynamics and expressive phrasing.",
 "Syncopation and sharp accents imitate the gallop of a horse.",
 "Syncopated, wandering melody; like a child getting lost in thought.",
 "A recurring theme is repeatedly interrupted by a faster, contrasting section resembling a jump scare in a scary story.",
 "A lullaby with a repeated left-hand figure. It gradually slows and fades to pianissimo like a child drifting to sleep.",
 "A hymn-like ending interrupted by a recitative-like middle section, evoking the poet speaking in the title."
];
const OVERVIEW = [
 "Composed in 1838 and published in 1839; 13 short piano pieces, about 18–20 minutes in all.",
 "Chosen from around 30 pieces Schumann wrote in a burst that spring; the others were left out of Op. 15.",
 "The titles came after the music, and Schumann called them light hints for the player and listener."
];
const mmss = t => Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
const PIECES = [
 ["Von fremden Ländern und Menschen","Of Foreign Lands and People"],
 ["Kuriose Geschichte","A Curious Story"],
 ["Hasche-Mann","Blind Man’s Buff"],
 ["Bittendes Kind","Pleading Child"],
 ["Glückes genug","Happy Enough"],
 ["Wichtige Begebenheit","An Important Event"],
 ["Träumerei","Dreaming"],
 ["Am Kamin","At the Fireside"],
 ["Ritter vom Steckenpferd","Knight of the Hobbyhorse"],
 ["Fast zu ernst","Almost Too Serious"],
 ["Fürchtenmachen","Frightening"],
 ["Kind im Einschlummern","Child Falling Asleep"],
 ["Der Dichter spricht","The Poet Speaks"]
];

const deck = document.getElementById('deck');
let html = `<section class="slide open" aria-label="Title">
<p class="small">Robert Schumann · Op. 15 · 1838</p>
<h1 class="d">Kinder<i>szenen</i></h1>
<p class="d sub">Scenes from <i>Childhood</i></p>
<p class="small">Thirteen pieces for piano</p></section>`;
html += `<section class="slide over" aria-label="Overview">
<div class="l"><div><p class="small" style="margin-bottom:16px">Kinderszenen, Op. 15</p><h2 class="d">Notes about the <i>collection</i></h2></div>
<ul>${OVERVIEW.map(t=>`<li>${t}</li>`).join("")}</ul></div>
<div class="r">
<figure class="q" style="margin:0"><blockquote>“I play the Kinderscenen to her in the evening two or three times a week; she is utterly delighted – and myself even more so, as you can imagine”</blockquote><cite>Franz Liszt, letter to Schumann, 5 June 1839, about playing the set for his young daughter Blandine-Rachel</cite></figure>
<figure class="q" style="margin:0"><blockquote>“Whether as an echo of your words to me once, that ‘sometimes I seem to you like a child,’ I suddenly got inspired and knocked off about thirty sweet little things, from which I have selected some twelve [later expanded to thirteen] and called them Kinderszenen. You will enjoy them, though you will certainly have to forget that you are a virtuoso.”</blockquote><cite>Robert Schumann, letter to Clara Wieck, March 1838</cite></figure>
</div></section>`;
PIECES.forEach(([de,en],i)=>{
  html += `<section class="slide piece" aria-label="${i+1}. ${de}">
<div class="left"><div>
<p class="small no">Kinderszenen, Op. 15 · No. ${i+1} of 13</p>
<h2 class="d">${de}</h2><p class="d en">${en}</p></div>
<div class="info" contenteditable="true" tabindex="0" role="textbox" aria-multiline="true" aria-label="Notes on ${en}"><span class="lbl">Notes</span>${NOTES[i]}</div></div>
</section>`;
});
html += `<div id="video-panel" class="hidden" aria-label="Performance score player">
<div class="video"><div id="yt-player"></div></div>
<div class="video-meta">
<span class="small">Ivan Moravec, piano (1976)</span>
<span class="small-dot">·</span>
<a id="yt-link" class="ts small" href="" target="_blank" rel="noopener">Open on YouTube</a>
<span class="small-dot">·</span>
<button type="button" id="btn-replay" class="btn-replay" aria-label="Restart piece">↺ Restart piece</button>
</div></div>`;
deck.innerHTML = html;

const KEY='kinderszenen-notes-v2';
let store={}; try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const infos=[...deck.querySelectorAll('.info')];
infos.forEach((el,i)=>{
  const v=store[i];
  if(v!=null) el.innerHTML=v;
  el.addEventListener('input',()=>{store[i]=el.innerHTML; try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}});
});

const slides=[...deck.querySelectorAll('.slide')], count=document.getElementById('count');
const videoPanel=document.getElementById('video-panel');
const ytLink=document.getElementById('yt-link');
const btnReplay=document.getElementById('btn-replay');
let cur = Math.min(Math.max((parseInt(location.hash.slice(1))||1)-1,0),slides.length-1);

let ytPlayer = null;
let ytReady = false;
let fallbackActive = false;

window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('yt-player', {
    width: '100%',
    height: '100%',
    videoId: VIDEO_ID,
    playerVars: {
      autoplay: 0,
      controls: 1,
      rel: 0,
      playsinline: 1,
      enablejsapi: 1
    },
    events: {
      onReady: () => {
        ytReady = true;
        if (cur >= 2) syncVideo(cur - 2, false);
      }
    }
  });
};

// Fallback in case YouTube API script is blocked
setTimeout(() => {
  if (!ytReady && !ytPlayer) {
    fallbackActive = true;
    setupFallbackIframe();
  }
}, 3000);

function setupFallbackIframe() {
  const container = document.querySelector('.video');
  if (!container) return;
  const pieceIdx = (cur >= 2) ? cur - 2 : 0;
  const start = STARTS[pieceIdx];
  const end = STARTS[pieceIdx + 1];
  container.innerHTML = `<iframe id="fallback-frame" src="https://www.youtube.com/embed/${VIDEO_ID}?start=${start}&end=${end}&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
}

function syncVideo(pieceIdx, autoPlay) {
  const start = STARTS[pieceIdx];
  const end = STARTS[pieceIdx + 1];
  ytLink.href = `https://www.youtube.com/watch?v=${VIDEO_ID}&t=${start}s`;
  ytLink.textContent = `Open on YouTube at ${mmss(start)}`;

  if (ytReady && ytPlayer && typeof ytPlayer.seekTo === 'function') {
    ytPlayer.seekTo(start, true);
    if (autoPlay) {
      ytPlayer.playVideo();
    } else {
      ytPlayer.pauseVideo();
    }
  } else if (fallbackActive) {
    const frame = document.getElementById('fallback-frame');
    if (frame) {
      frame.src = `https://www.youtube.com/embed/${VIDEO_ID}?start=${start}&end=${end}&rel=0` + (autoPlay ? '&autoplay=1' : '');
    }
  }
}

// Bounds enforcement to prevent bleeding into next piece
setInterval(() => {
  if (ytPlayer && ytReady && cur >= 2) {
    const pIdx = cur - 2;
    const end = STARTS[pIdx + 1];
    if (end && typeof ytPlayer.getPlayerState === 'function' && ytPlayer.getPlayerState() === 1) {
      if (ytPlayer.getCurrentTime() >= end - 0.25) {
        ytPlayer.pauseVideo();
        ytPlayer.seekTo(STARTS[pIdx], true);
      }
    }
  }
}, 250);

function show(n){
  cur=Math.min(Math.max(n,0),slides.length-1);
  slides.forEach((s,i)=>s.classList.toggle('on',i===cur));
  count.textContent=(cur+1)+' / '+slides.length;
  history.replaceState(null,'','#'+(cur+1));
  if (cur >= 2) {
    videoPanel.classList.remove('hidden');
    syncVideo(cur - 2, false);
  } else {
    videoPanel.classList.add('hidden');
    if (ytReady && ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
      ytPlayer.pauseVideo();
    }
  }
}

btnReplay.onclick = () => {
  if (cur >= 2) syncVideo(cur - 2, true);
};

function fit(){
  const k=Math.min(innerWidth/1280,(innerHeight-64)/720);
  deck.style.transform=`translateY(-24px) scale(${k})`;
}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
addEventListener('keydown',e=>{
  if(e.target.isContentEditable) return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}
  if(e.key==='Home')show(0); if(e.key==='End')show(slides.length-1);
});
addEventListener('resize',fit); fit(); show(cur);
</script>
</body>
</html>
